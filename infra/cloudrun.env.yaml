# Plain (non-secret) environment for Cloud Run service "meta-aira".
# Used with: gcloud run deploy meta-aira ... --env-vars-file=infra/cloudrun.env.yaml
# Secrets (MODEL_API_KEY, APP_KEY, READER2_API_KEY) are NOT here: they are mounted from
# Secret Manager (meta-aira-* secrets) once created. Names match backend/aira/config.py.

# Real models: MODEL_API_KEY and APP_KEY are mounted from Secret Manager (see deploy.yml --set-secrets).
# Set to "1" for canned model output with nothing billed.
AIRA_MOCK: "0"

# Meta Model API endpoints
META_BASE_URL: "https://api.meta.ai/v1"
META_ASR_URL: "wss://api.meta.ai/v1/asr/realtime"

# Model per role (contributor variants are cheaper; switch to standard for the recorded demo)
MODEL_AGENT: "muse-spark-1.3-contributor"
MODEL_READ: "muse-spark-1.3-contributor"
MODEL_VERIFY: "muse-spark-1.2-contributor"
MODEL_SAM: "sam-3.1"
MODEL_ASR: "muse-voice-transcribe-1.0"
REASONING_EFFORT: "minimal"

# Optional open-weights second reader (Muse Glimmer on Modal). Empty = use MODEL_VERIFY on Meta API.
READER2_BASE_URL: ""
READER2_MODEL: ""

# Storage: "memory" (single instance, resets on restart) until Firestore DB "meta-aira" exists.
STORE: "memory"
GCP_PROJECT: "gemini-enterprise-475109"
FIRESTORE_DB: "meta-aira"
SHOP_ID: "aira-cricket"

# Speech recognition language bias (JSON list of language names)
ASR_LANGUAGES: '["Tamil", "English", "Hindi"]'
